[package]
name = "typo"
version = "0.1.1"
description = "Typo - A Typora-style WYSIWYG Markdown editor"
edition = "2021"
rust-version = "1.70"

[lib]
name = "typo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Native clipboard access. The WebKitGTK webview blocks `document.execCommand('paste')`
# outright and gates `navigator.clipboard.readText()` behind a permission request that
# Tauri never answers, so the editor's cut/copy/paste buttons need a native path.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# HTTP client for downloading remote images. `rustls-tls` (no default features)
# avoids a system OpenSSL dependency so the cross-platform build stays simple.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[features]
# This feature is used for production builds where `devUrl` is disabled.
custom-protocol = ["tauri/custom-protocol"]
